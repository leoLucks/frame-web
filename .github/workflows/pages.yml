name: Deploy FRAME website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  FRAME_PAGES_ARTIFACT: frame-pages-${{ github.run_id }}-${{ github.run_attempt }}
  FRAME_VERSION: "0.1.5"
  FRAME_VERSION_CODE: "8"
  FRAME_API_ORIGIN: "https://frame-public-cloud-api.leojames19970101.chatgpt.site"
  FRAME_PAGES_ORIGIN: "https://leolucks.github.io"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify stored artifacts and reconstruct Android APK
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="releases/v${FRAME_VERSION}"
          apk="FRAME-${FRAME_VERSION}-android.apk"
          web="FRAME-${FRAME_VERSION}-web.zip"
          release_dir="$RUNNER_TEMP/frame-release"
          mkdir -p "$release_dir"
          printf '%s  %s\n' \
            '71e66c04f0728af0091ac68ecea47cd1f73ff88c6d82c04bc9696c9442fe5ab9' "$artifact_dir/$apk.part01" \
            '17a30cf1f96b9573d4aa4ec4ac28528699c514fcbf9cd3c8bc10820d839dc733' "$artifact_dir/$apk.part02" \
            '9eb47e6012533d8004631d6a9aa619b14eb0ef50a093b9f960be6b3b8f0775e2' "$artifact_dir/$web" \
            | sha256sum --check --strict -
          cat "$artifact_dir/$apk.part01" "$artifact_dir/$apk.part02" > "$release_dir/$apk"
          printf '%s  %s\n' \
            'b8b2bbf3ca8ee62b2d67a73615739bcff778a116dd584071fb28f05240b8af35' "$release_dir/$apk" \
            | sha256sum --check --strict -
          printf '%s  %s\n' \
            'b8b2bbf3ca8ee62b2d67a73615739bcff778a116dd584071fb28f05240b8af35' "$apk" \
            | cmp - "$artifact_dir/$apk.sha256"
          cp "$artifact_dir/$web" "$artifact_dir/$apk.sha256" "$release_dir/"
          (cd "$release_dir" && sha256sum --check --strict "$apk.sha256")
      - name: Publish complete versioned Release assets without overwriting existing files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${FRAME_VERSION}"
          apk="FRAME-${FRAME_VERSION}-android.apk"
          web="FRAME-${FRAME_VERSION}-web.zip"
          release_dir="$RUNNER_TEMP/frame-release"
          existing_dir="$(mktemp -d "$RUNNER_TEMP/frame-existing.XXXXXX")"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" \
              "$release_dir/$apk" "$release_dir/$web" "$release_dir/$apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FRAME ${FRAME_VERSION}" --notes-file RELEASE_NOTES.md
          fi
          for name in "$apk" "$web" "$apk.sha256"; do
            existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .name")"
            if [[ -n "$existing" ]]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$existing_dir"
              cmp "$release_dir/$name" "$existing_dir/$name"
            else
              gh release upload "$tag" "$release_dir/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo '::error::The existing Release is a draft; publish it before deploying Pages.'
            exit 1
          fi
      - name: Extract the verified compiled website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          unzip -q "releases/v${FRAME_VERSION}/FRAME-${FRAME_VERSION}-web.zip" -d site
          test -f site/index.html
          test -f site/official/index.html
          python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib
          manifest = json.loads(pathlib.Path('site/updates/stable.json').read_text())
          version = os.environ['FRAME_VERSION']
          apk_name = 'FRAME-' + version + '-android.apk'
          apk = pathlib.Path(os.environ['RUNNER_TEMP'], 'frame-release', apk_name).read_bytes()
          release = manifest['android']
          assert manifest['schemaVersion'] == 1 and manifest['appId'] == 'studio.frame.nikon' and manifest['channel'] == 'stable'
          assert release['version'] == version and release['versionCode'] == int(os.environ['FRAME_VERSION_CODE'])
          assert release['sha256'] == hashlib.sha256(apk).hexdigest() and release['sizeBytes'] == len(apk)
          assert release['url'] == 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/v' + version + '/' + apk_name
          assert manifest['releaseUrl'] == 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tag/v' + version
          assert isinstance(release['notes'], list) and release['notes']
          print('Official website and update manifest match the verified APK')
          PYVERIFY
      - name: Require healthy public API and Pages CORS before deploying
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile

          api_origin = os.environ['FRAME_API_ORIGIN']
          pages_origin = os.environ['FRAME_PAGES_ORIGIN']

          def read_json(path, body=None):
              with tempfile.TemporaryDirectory() as temp:
                  headers_path = pathlib.Path(temp) / 'headers'
                  body_path = pathlib.Path(temp) / 'body.json'
                  command = ['curl', '--silent', '--show-error', '--connect-timeout', '10', '--max-time', '35',
                             '--request', 'GET' if body is None else 'POST',
                             '--header', 'Origin: ' + pages_origin, '--header', 'Accept: application/json',
                             '--dump-header', str(headers_path), '--output', str(body_path), '--write-out', '%{http_code}']
                  if body is not None:
                      command += ['--header', 'Content-Type: application/json', '--data-binary', json.dumps(body)]
                  command += [api_origin + path]
                  response = subprocess.run(command, check=True, capture_output=True, text=True)
                  if response.stdout.strip() != '200':
                      raise RuntimeError('Public API did not return HTTP 200: ' + response.stdout.strip())
                  headers = {}
                  for line in headers_path.read_text().splitlines():
                      if ':' in line:
                          name, value = line.split(':', 1)
                          headers[name.lower()] = value.strip()
                  if headers.get('access-control-allow-origin') != pages_origin:
                      raise RuntimeError('Public API did not allow the exact Pages Origin')
                  if headers.get('access-control-allow-credentials') is not None:
                      raise RuntimeError('Public API unexpectedly allows credentials')
                  return json.loads(body_path.read_text())

          health = read_json('/api/nikon/health')
          if health.get('status') != 'ok' or health.get('publicRecipes') is not True or health.get('accountSession') is not False:
              raise RuntimeError('Public API health response has an unexpected scope')
          catalog = read_json('/api/nikon/recipes', {'ownerUserId': 'nikon', 'bookId': '', 'sortType': 0, 'lang_code': 'zh-cn', 'country': 'CN'})
          if not isinstance(catalog.get('recipe'), list) or not catalog['recipe'] or not isinstance(catalog.get('recipe_book'), list):
              raise RuntimeError('Public API returned no public recipes')
          print('Public API HTTP 200 and exact Pages CORS verified; public recipes:', len(catalog['recipe']))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.FRAME_PAGES_ARTIFACT }}
          path: site
      - name: Wait for the current Pages artifact to be visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visible=0
          for attempt in $(seq 1 30); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$FRAME_PAGES_ARTIFACT\" and .expired == false)] | length" || echo 0)"
            if [ "$count" = 1 ]; then
              visible=$((visible + 1))
              if [ "$visible" -ge 2 ]; then
                echo "Current Pages artifact is visible"
                exit 0
              fi
            else
              visible=0
            fi
            sleep 2
          done
          echo "Current Pages artifact did not become visible in time" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.FRAME_PAGES_ARTIFACT }}
